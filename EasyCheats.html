<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<title>EasyCheats Store</title>

<script>
/* Kayıtlı temayı ilk boyamadan önce uygula (yanıp sönme olmasın). Varsayılan: siyah-beyaz. */
try {
  var __t = localStorage.getItem('eac-theme');
  if (__t === 'purple' || __t === 'blue' || __t === 'green') document.documentElement.setAttribute('data-theme', __t);
} catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Dela+Gothic+One&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<!-- İkonlar: ağır JS yerine hafif CSS web-font -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/fa-solid-900.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/fa-regular-400.woff2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* Tema: renkler yalnızca aşağıdaki değişkenlerden gelir.
   Varsayılan = Siyah Beyaz. [data-theme] ile mor / mavi / yeşil. Glow / parlama yok. */
:root {
  color-scheme: dark;
  --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c; --surface-3: #272727; --line: #2a2a2a;
  --fg: #f2f2f2; --muted: #9b9b9b;
  --accent: #ffffff; --accent-strong: #f2f2f2; --accent-soft: #2a2a2a; --on-accent: #0a0a0a; --btn-star: #0a0a0a;
  --btn-a: #ffffff; --btn-b: #d9d9d9;
  --sel-a: #2b2b2b; --sel-b: #1b1b1b; --sel-ring: rgba(255,255,255,.55);
  --sheet-bg: #0f0f0f; --sheet-s: #191919; --sheet-s2: #222222; --sheet-s3: #2d2d2d;
  --dock-bg: rgba(20,20,20,.97); --scrim: rgba(0,0,0,.78); --key-bg: #080808; --avatar-bg: #050505; --toast-bg: #2a2a2a;
  --inv-a: #2e2e2e; --inv-b: #171717; --inv-em: #ffffff; --inv-p: #bdbdbd; --pill-bg: #0a0a0a;
  --promo-a: #2a2a2a; --promo-b: #161616; --note: #b3b3b3;
  --hero-a: #232323; --hero-b: #0a0a0a; --stripe-a: #707070; --stripe-b: #454545; --line-a: #5a5a5a; --line-b: #f0f0f0;
  --logo-a: #ffffff; --logo-b: #a6a6a6; --logo-check: #0a0a0a;
  --gift-a: #ffffff; --gift-b: #bdbdbd; --gift-top: #ffffff; --ribbon: #3a3a3a; --bow: #575757;

  --gold: #f6c244;
  --good: #4fd08a;
  --bad: #f07a7a;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --spring: cubic-bezier(.34, 1.32, .64, 1);
}
:root[data-theme="purple"] {
  --accent: #8b7be8; --accent-strong: #6f5fdc; --accent-soft: #2e2b5c; --on-accent: #ffffff; --btn-star: #f6c244;
  --btn-a: #8e7ee9; --btn-b: #6f5fdc;
  --inv-a: #5a49c6; --inv-b: #3d3290; --inv-em: #d6cfff; --inv-p: #d9d3ff; --line-a: #5b4bc9; --line-b: #c5bcff;
  --logo-a: #9a8bf0; --logo-b: #5846c9; --logo-check: #ffffff;
  --gift-a: #f1eefc; --gift-b: #b9b0e6; --gift-top: #f6f4ff; --ribbon: #7f6ee6; --bow: #8f7ff0;
  --sel-ring: var(--accent); --stripe-a: #7d75b6; --stripe-b: #5c5588;
}
:root[data-theme="blue"] {
  --accent: #5ea1ff; --accent-strong: #2f6fdb; --accent-soft: #14305c; --on-accent: #ffffff; --btn-star: #f6c244;
  --btn-a: #4d8ff0; --btn-b: #2b66d6;
  --inv-a: #2a63c8; --inv-b: #173d86; --inv-em: #cfe1ff; --inv-p: #d3e3ff; --line-a: #2a62c9; --line-b: #a9ccff;
  --logo-a: #6aa8ff; --logo-b: #2557bf; --logo-check: #ffffff;
  --gift-a: #eef4ff; --gift-b: #a9c1e8; --gift-top: #f3f7ff; --ribbon: #3b78e0; --bow: #5b95f2;
  --sel-ring: var(--accent); --stripe-a: #6c93cf; --stripe-b: #4a6b9e;
}
:root[data-theme="green"] {
  --accent: #3fd68f; --accent-strong: #178a5a; --accent-soft: #123d2b; --on-accent: #ffffff; --btn-star: #f6c244;
  --btn-a: #2bb57a; --btn-b: #178a5a;
  --inv-a: #1b7d55; --inv-b: #0e4632; --inv-em: #b5f5d6; --inv-p: #c4efd8; --line-a: #1b8c5c; --line-b: #a6f5cf;
  --logo-a: #4be09c; --logo-b: #12754d; --logo-check: #ffffff;
  --gift-a: #eaf8f0; --gift-b: #a6d6bd; --gift-top: #f1faf5; --ribbon: #1f9d66; --bow: #2bb57a;
  --sel-ring: var(--accent); --stripe-a: #5fab8c; --stripe-b: #3e7b63;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body, button, input, summary, code { font-family: var(--font); font-weight: 700; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
button { color: inherit; cursor: pointer; touch-action: manipulation; transition: transform .35s var(--ease), background-color .25s ease, color .25s ease, border-color .25s ease, opacity .25s ease; }
button:active { transform: scale(.96); transition-duration: .1s; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-weight: 900; }
h3, h4, strong, b { font-weight: 800; }
.app { max-width: 430px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 0 calc(150px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.ico { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 1.25em; height: 1.25em; font-size: 18px; line-height: 1; }
.ico.gold { color: var(--gold); }
.muted { color: var(--muted); }
.accent { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.boldonse-regular { font-family: "Boldonse", system-ui; font-weight: 400; font-style: normal; }

/* yıldız fiyat birimi */
.stv { display: inline-flex; align-items: center; gap: .3em; white-space: nowrap; }
.stv .ico { font-size: .78em; width: auto; height: auto; }
/* Yıldız ikonu kutunun ortasında durur ama rakamlar Inter'de biraz yukarıdadır: optik hiza için yıldızı yukarı al */
.stv .ico { translate: 0 -.09em; }
/* satır içinde (metin akışında) duran yıldızlar zaten hizalı */
#paynote .stv .ico, .buy-info p .stv .ico { translate: none; }
.tx .ta .stv .ico { translate: 0 .08em; }
/* "X ☆ yükle" butonu: metin akışı yerine flex ile ortala */
.topup-btn > span { display: inline-flex; align-items: center; gap: .35em; }
.topup-btn .stv .ico { translate: 0 .15em; }
/* cüzdan bakiyesi: büyük rakamla yıldız karosu */
.w-bal .bal-ico .ico { translate: 0 -1px; }

/* geçişler */
#view { transition: none; }
#view.leaving { opacity: 0; transform: translate3d(0, -6px, 0); transition: opacity .16s ease, transform .16s ease; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; animation-timing-function: ease; }

/* ekran dışı / alt sayfa arkasındaki animasyonları duraklat */
.paused * { animation-play-state: paused !important; }
body.locked .app * { animation-play-state: paused !important; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
/* Yazı logosu: ultra kalın font + "Cheats" eğik etiket.
   Tüm ölçüler em: fitBrand() font-size'ı küçültünce hepsi birlikte ölçeklenir. Renkler tema değişkenlerinden gelir. */
.brand-name { display: flex; align-items: baseline; font-family: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif; font-weight: 400; font-style: normal; font-size: clamp(20px, 7.6vw, 33px); line-height: 1.15; letter-spacing: -0.02em; white-space: nowrap; min-width: 0; overflow: hidden; padding: .1em .2em .18em .02em; }
.brand-name b { font-weight: 400; }
.brand-name .b1 { color: var(--fg); text-shadow: .055em .055em 0 var(--stripe-b); }
.brand-name .b2 { position: relative; isolation: isolate; margin: 0 .12em 0 .12em; padding: .06em .2em .1em; color: var(--on-accent); }
.brand-name .b2::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: .16em; background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); box-shadow: .055em .055em 0 var(--stripe-b); transform: skewX(-12deg); }
.top-actions { display: flex; gap: 10px; flex: none; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); border: 0; display: grid; place-items: center; position: relative; flex: none; }
.icon-btn:hover { background: var(--surface-3); }
.icon-btn.small { width: 44px; height: 44px; background: transparent; }
.icon-btn.small:hover { background: var(--surface-2); }
.dot { position: absolute; top: 11px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: blink 2.6s var(--ease-io) infinite; }

.chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 18px; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--surface); border: 0; display: flex; align-items: center; gap: 8px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent-strong); color: var(--on-accent); }

/* hero */
.hero { position: relative; isolation: isolate; overflow: hidden; margin-top: 14px; aspect-ratio: 985 / 522; border-radius: 26px; background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); padding: 22px 22px 20px; display: flex; flex-direction: column; justify-content: space-between; }
.hero-stripes { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.hero-soldier { position: absolute; left: 49%; top: 3%; height: 110%; width: auto; max-width: none; z-index: 1; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.hero h2, .hero p { position: relative; z-index: 2; margin: 0; }
.hero h2 { font-size: 32px; font-weight: 900; line-height: 1.06; letter-spacing: -0.03em; }
.hero p { max-width: 56%; font-size: 13px; line-height: 1.35; font-weight: 700; color: var(--fg); }

/* SVG sanat animasyonları */
.flow .ring { transform-box: fill-box; transform-origin: center; }
.flow .r1 { animation: spin 40s linear infinite; }
.flow .r2 { animation: spin 18s linear infinite reverse; }
.flow .core { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s var(--ease-io) infinite; }
.flow .tick { transform-box: fill-box; transform-origin: center; animation: breathe 4.5s var(--ease-io) infinite; }
.flow .w1 { animation: dash 2.4s linear infinite; }
.flow .w2 { animation: dash 3.6s linear infinite reverse; }
.flow .w3 { animation: dash 5s linear infinite; }
.flow.still * { animation: none !important; }
.gift { animation: float 4.6s var(--ease-io) infinite; transform-origin: 70% 90%; }
.gift .g2 { animation: float 3.8s var(--ease-io) -1.2s infinite; }
.gbox { fill: url(#gGift); }
.gtop { fill: var(--gift-top); }
.grib { fill: var(--ribbon); }
.gbow { fill: var(--bow); }

/* ürün kartı */
.pcard { position: relative; margin-top: 14px; border-radius: 26px; background: var(--surface); overflow: hidden; cursor: pointer; transition: transform .45s var(--ease); }
.pcard:active { transform: scale(.98); transition-duration: .12s; }
@media (hover: hover) { .pcard:hover { transform: translate3d(0, -4px, 0); } }
.pimg { position: relative; overflow: hidden; }
.pimg .art { display: block; width: 100%; aspect-ratio: 16 / 11; transition: transform .9s var(--ease); }
@media (hover: hover) { .pcard:hover .pimg .art { transform: scale(1.05); } }
.gtag { position: absolute; top: 16px; right: 68px; display: flex; align-items: center; gap: 6px; font-size: 15px; }
.star-btn { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.55); border: 0; display: grid; place-items: center; }
.star-btn .ico { grid-area: 1 / 1; font-size: 20px; transition: opacity .3s var(--ease), transform .5s var(--spring); }
.star-btn .on { opacity: 0; transform: scale(.3) rotate(-70deg); color: var(--gold); }
.star-btn[aria-pressed="true"] .on { opacity: 1; transform: none; }
.star-btn[aria-pressed="true"] .off { opacity: 0; transform: scale(.3) rotate(70deg); }
.pfrom { position: absolute; left: 20px; bottom: 18px; display: flex; flex-direction: column; }
.pfrom > span { font-size: 14px; color: var(--muted); }
.pfrom strong { font-size: 44px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pfrom .stv { gap: 10px; }
.pfrom .stv .ico { font-size: .56em; }
/* Cry4me resim kartı: kırpılmayan görsel + altında yazılar */
.pcard-img { display: block; width: 100%; height: auto; aspect-ratio: auto 4 / 3; object-fit: contain; background: var(--surface-2); transition: transform .9s var(--ease); user-select: none; -webkit-user-drag: none; }
@media (hover: hover) { .pcard:hover .pcard-img { transform: scale(1.05); } }
.pcap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 3px; padding: 44px 20px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.72)); pointer-events: none; }
.pcap strong { font-family: var(--font); font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.pcap-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; line-height: 1.3; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.pcap-sub .pr { font-weight: 800; }
.pcap-sub em { font-style: normal; font-weight: 700; }
.pbody { padding: 6px 22px 24px; }
.pbody h3 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.02em; }
.pbody p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }

.empty { margin-top: 14px; border-radius: 26px; background: var(--surface); padding: 36px 24px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty .ico { font-size: 30px; color: var(--accent); animation: float 4s var(--ease-io) infinite; }
.empty h3 { margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--muted); max-width: 30ch; }
.empty .btn-ghost { margin-top: 10px; width: auto; padding: 0 22px; }

/* sayfalar */
.h1 { margin: 6px 0 16px; font-size: 36px; letter-spacing: -0.03em; line-height: 1.1; }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 22px; padding: 6px; }
.seg .knob { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 16px; background: var(--surface-3); transform: translate3d(calc(var(--k, 0) * 100%), 0, 0); transition: transform .5s var(--ease); will-change: transform; }
.seg button { position: relative; min-width: 0; height: 50px; border-radius: 16px; background: transparent; border: 0; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
.seg button:active { transform: none; }
.seg button[aria-selected="true"] { color: var(--fg); }
.count { min-width: 28px; height: 28px; padding: 0 7px; border-radius: 14px; background: var(--surface-3); display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums; transition: background-color .3s, color .3s; }
.seg button[aria-selected="true"] .count { background: var(--accent-strong); color: var(--on-accent); }
.list { margin-top: 2px; }
.buy { margin-top: 12px; background: var(--surface); border-radius: 24px; padding: 18px; display: grid; gap: 14px; overflow: hidden; transition: height .5s var(--ease), margin .5s var(--ease), padding .5s var(--ease), opacity .3s ease, transform .45s var(--ease); }
.buy.out { height: 0 !important; margin-top: 0; padding-block: 0; opacity: 0; transform: scale(.97); }
.buy-top { display: flex; gap: 14px; align-items: center; }
.thumb { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; flex: none; }
.thumb .art { width: 100%; height: 100%; display: block; }
.buy-info { min-width: 0; flex: 1; }
.buy-info h3 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
.buy-info p { margin: 2px 0 0; color: var(--muted); font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; }
.pill { flex: none; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
.pill.on { background: rgba(79,208,138,.14); color: var(--good); }
.pill.wait { background: rgba(246,194,68,.14); color: var(--gold); animation: blink 2.6s var(--ease-io) infinite; }
.key { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--key-bg); border-radius: 18px; padding: 16px 18px; min-width: 0; cursor: pointer; transition: transform .35s var(--ease); }
.key:active { transform: scale(.985); }
.key code { transition: color .3s ease; }
.key.copied code { color: var(--good); }
.key code { font-size: 15px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
.buy .muted { margin: 0; font-size: 15px; }
.btn-ghost { width: 100%; height: 54px; border-radius: 18px; background: var(--surface-2); border: 0; font-size: 16px; }
.btn-ghost:hover { background: var(--surface-3); }
.btn-ghost:disabled { opacity: .6; cursor: progress; animation: blink 1.4s var(--ease-io) infinite; }

/* profil */
.pro { background: var(--surface); border-radius: 26px; padding: 22px; }
.pro-top { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; min-width: 0; }
.avatar { position: relative; width: 72px; height: 72px; border-radius: 50%; background: var(--avatar-bg); display: grid; place-items: center; flex: none; }
.pro h2 { margin: 0; font-size: 25px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.pro h2.boldonse-regular { font-size: 15px; line-height: 1.5; letter-spacing: 0; }
.pro-top p { margin: 2px 0 0; color: var(--muted); font-size: 17px; }
.pro-id { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; gap: 10px; }
.bal { display: flex; align-items: center; gap: 14px; min-width: 0; }
.bal-ico { width: 52px; height: 52px; border-radius: 18px; background: rgba(246,194,68,.12); display: grid; place-items: center; flex: none; }
.bal-ico .ico { font-size: 26px; }
.bal strong { display: block; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.bal-lbl { display: block; color: var(--muted); font-size: 15px; }
.chip-btn { flex: none; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--surface-2); border: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.chip-btn:hover { background: var(--surface-3); }
.chip-btn .ico { font-size: 13px; width: auto; height: auto; }
.invite { position: relative; overflow: hidden; margin-top: 14px; border-radius: 26px; background: linear-gradient(135deg, var(--inv-a), var(--inv-b)); padding: 24px; min-height: 210px; }
.invite .gift-art { position: absolute; right: -8px; bottom: -6px; width: 52%; height: 78%; }
.invite > *:not(.gift-art) { position: relative; }
.invite h2 { margin: 0; max-width: 11ch; font-size: 29px; line-height: 1.12; letter-spacing: -0.03em; text-wrap: balance; }
.invite h2 em { font-style: normal; color: var(--inv-em); }
.invite p { margin: 8px 0 18px; color: var(--inv-p); max-width: 20ch; }
.pill-btn { height: 52px; padding: 0 20px; border-radius: 999px; background: var(--pill-bg); border: 0; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; }
.pill-btn .ico { transition: transform .35s var(--ease); }
.pill-btn:hover .ico { transform: translate3d(4px, 0, 0); }
.rows { display: grid; gap: 12px; margin-top: 14px; }

        } else {
          var had = state.promo; state.promo = 0;
          setPmsg(false, code ? 'Böyle bir kod yok. Yazımı kontrol et.' : 'Bir kod gir.');
          if (pin) shake(pin);
          if (had) updateTotal(true);
        }
        break;
      case 'pay':
        if (state.paying) break;
        var cost = priceNow();
        if (cost > state.balance) {
          goWalletNeed();
          break;
        }
        state.paying = true;
        var pb = $('#pay-btn'); pb.classList.add('busy'); pb.disabled = true;
        setTimeout(function () {
          if (state.sheet !== 'product') return;
          var t = tariff();
          var p = { id: state.nextId++, label: t.label, price: cost, date: new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }), status: 'active', key: makeKey() };
          state.balance -= cost;
          state.tx.unshift({ type: 'out', title: 'Cry4me · ' + t.label, amount: cost, date: p.date });
          state.purchases.unshift(p);
          state.paying = false; state.paid = p;
          renderSheet();
          sheet.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
        }, 1300);
        break;
      case 'goto-purchases':
        state.tab = 'all'; closeSheet();
        if (location.hash.replace('#', '') === 'purchases') { state.view = ''; route(); }
        else location.hash = 'purchases';
        break;
      case 'check':
        var item = state.purchases.filter(function (x) { return String(x.id) === arg; })[0];
        if (!item || el.disabled) break;
        el.disabled = true; el.textContent = 'Kontrol ediliyor…';
        setTimeout(function () {
          item.status = 'active'; item.key = makeKey();
          var card = $('.buy[data-id="' + item.id + '"]');
          updateCounts();
          if (card && state.tab === 'pending') {
            card.style.height = card.offsetHeight + 'px';
            void card.offsetWidth;
            card.classList.add('out');
            setTimeout(function () {
              card.remove();
              if (!filtered().length) { var pl = $('#plist'); pl.innerHTML = listHtml(); animIn(pl.children); }
            }, reduce ? 0 : 500);
          } else if (card) {
            var tmp = document.createElement('div'); tmp.innerHTML = buyCard(item);
            var neu = tmp.firstChild;
            card.replaceWith(neu);
            animIn([neu]);
          }
          toast('Ödeme onaylandı, anahtar verildi');
        }, 1100);
        break;
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    act(el.getAttribute('data-action'), el.getAttribute('data-arg'), el);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.sheet) { closeSheet(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pcard')) {
      e.preventDefault(); act('open-product');
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('key')) {
      e.preventDefault(); act('copy', e.target.getAttribute('data-arg'), e.target);
    }
    if (e.key === 'Enter' && e.target.id === 'w-amt') { e.preventDefault(); act('deposit'); }
    if (e.key === 'Enter' && e.target.id === 'promo-input') { e.preventDefault(); act('apply-promo'); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'w-amt') return;
    if (amtCancel) amtCancel();
    var v = e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 6);
    if (e.target.value !== v) e.target.value = v;
    syncAmount();
  });
  scrim.addEventListener('click', closeSheet);
  sheet.addEventListener('pointerdown', dragStart);
  sheet.addEventListener('pointermove', dragMove);
  sheet.addEventListener('pointerup', dragEnd);
  sheet.addEventListener('pointercancel', dragEnd);
  sheet.addEventListener('touchstart', pullStart, { passive: true });
  sheet.addEventListener('touchmove', pullMove, { passive: false });
  sheet.addEventListener('touchend', pullEnd);
  sheet.addEventListener('touchcancel', pullEnd);
  window.addEventListener('hashchange', function () { route(); });
  route(true);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<title>EasyCheats Store</title>

<script>
/* Kayıtlı temayı ilk boyamadan önce uygula (yanıp sönme olmasın). Varsayılan: siyah-beyaz. */
try {
  var __t = localStorage.getItem('eac-theme');
  if (__t === 'purple' || __t === 'blue' || __t === 'green') document.documentElement.setAttribute('data-theme', __t);
} catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Dela+Gothic+One&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<!-- İkonlar: ağır JS yerine hafif CSS web-font -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/fa-solid-900.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/fa-regular-400.woff2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/style.css?v=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--hero-a)"/><stop offset="1" style="stop-color:var(--hero-b)"/></linearGradient>
    <linearGradient id="gLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0"><stop offset="0" style="stop-color:var(--line-a)"/><stop offset="1" style="stop-color:var(--line-b)"/></linearGradient>
    <linearGradient id="gLogo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-a)"/><stop offset="1" style="stop-color:var(--logo-b)"/></linearGradient>
    <linearGradient id="gGift" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--gift-a)"/><stop offset="1" style="stop-color:var(--gift-b)"/></linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 40 40">
    <path d="M20 2.5l14.5 5.5v10.2c0 9.2-6 15.9-14.5 19.3C11.5 34.1 5.5 27.4 5.5 18.2V8z" fill="url(#gLogo)"/>
    <path d="M13 20.5l5 5 9-10.5" fill="none" style="stroke:var(--logo-check)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div class="app"><main id="view"></main></div>

<nav class="dock" aria-label="Ana gezinme">
  <div class="dock-in">
    <button class="tab" id="tab-purchases" data-action="nav" data-arg="purchases"><i class="ico fa-solid fa-receipt" aria-hidden="true"></i>Satın alımlar</button>
    <button class="cart" id="tab-catalog" data-action="nav" data-arg="catalog" aria-label="Katalog"><i class="ico fa-solid fa-cart-shopping" aria-hidden="true"></i></button>
    <button class="tab" id="tab-profile" data-action="nav" data-arg="profile"><i class="ico fa-solid fa-user" aria-hidden="true"></i>Profil</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js?v=1"></script>
</body>
</html>
